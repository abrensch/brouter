plugins {
    id 'brouter.application-conventions'
    id 'java-test-fixtures'
}

dependencies {
    implementation project(':brouter-codec')
    implementation project(':brouter-util')
    implementation project(':brouter-expressions')

    implementation 'org.openstreetmap.osmosis:osmosis-osm-binary:0.48.3'

    // ImageIO plugin for the lossless WebP tiles in Mapterhorn's PMTiles archives.
    // Wraps libwebp; a pure-Java decoder was rejected upstream in GraphHopper because
    // it mis-decoded elevation in some coastal regions.
    implementation 'com.github.usefulness:webp-imageio:0.10.0'

    testImplementation testFixtures(project(':brouter-map-creator'))
}

test {
    // SwissAlti3dValidationTest builds a full 1-arcsecond cell raster (648 MB)
    maxHeapSize = '2g'
}
