plugins {
    id 'java'
    id 'checkstyle'
    id 'pmd'
    id 'brouter.version-conventions'
}

group = 'org.btools'

repositories {
    mavenCentral()
}

java {
    // Pin the build JDK: PMD 7.0.0 mass-produces LooseCoupling false positives
    // when run under newer JDKs (verified under Java 25), so builds must run
    // on 17 — the same JDK CI uses. Bytecode stays Java 11 via options.release
    // below. gradle/gradle-daemon-jvm.properties pins the daemon JVM to match
    // (PMD executes in the daemon process).
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

compileJava {
    options.release = 11
}

pmd {
    consoleOutput = true
    toolVersion = '7.0.0'
    rulesMinimumPriority = 5
    ruleSetFiles = files("${rootProject.rootDir}/config/pmd/pmd-ruleset.xml")
    ruleSets = []
    // ignoreFailures = true
}
